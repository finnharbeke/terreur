<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>terreur</title>
    <script type="module" crossorigin src="/assets/index-CxXtSHpw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DRyukVEo.css">
  </head>
  <body>
    <!-- <h1 class="text-3xl font-bold underline text-blue-600">
      Hello world!
    </h1> -->
    <div id="loader" class="absolute left-0 right-0 top-0 mx-auto bg-black/60
      w-full h-full backdrop-blur-sm text-slate-300 text-center text-2xl hidden">
      <p class="mt-40">
        Merci. Votre vote "<span id="loader_span"></span>" est enregistré.
      </p>
      <div
      class="w-30 h-30 border-8 border-t-blue-500 border-gray-300 rounded-full animate-spin
      mx-auto mt-5"
      ></div>
      <!-- <p class="mt-5">
        Attendez s'il vous plait...
      </p> -->
    </div>
    <div id="config" class="absolute left-0 right-0 mx-auto bg-black/0
      top-20 w-1/2 bg-zinc-800 rounded-lg border-8 border-zinc-700 hidden">

      <div class="max-w-md mx-auto text-zinc-300 mt-2">
        <label for="round-select">round</label>
        <select name="round" id="round-select" class=
        "block w-full mt-1 mb-3 pl-3 pr-10 py-2.5 border border-zinc-700 text-sm rounded-xl shadow-xs placeholder:text-body focus:outline-none"
        ></select>

        <div id="results" class="">

          <h1 class="text-2xl text-zinc-400">résultats: <span id="judgement"></span></h1>
          <p id="result_status" class="text-sm text-zinc-600"></p>
          <p class="text-zinc-400 mt-3">
            numéro des votes "coupable": <span id="nr-coupable">-</span>
          </p>
          <p class="text-zinc-400">
            numéro des votes "non-coupable": <span id="nr-noncoupable">-</span>
          </p>
        </div>
        <div class="border-t-1 border-gray-400 dark:border-gray-500 my-3"></div>
        <label for="newround">create a new round</label>
        <input name="newround" id="newround_input" placeholder="round name" class=
        "block w-full mt-1 mb-1 pl-3 pr-10 py-2.5 border border-zinc-700 text-sm rounded-xl shadow-xs placeholder:text-body focus:outline-none"
        ></input>
        <button id="newround_button" class="
        w-full
        bg-blue-700
        hover:bg-blue-800
        focus:outline-2 focus:outline-offset-1
        focus:outline-blue-700
        active:bg-blue-900

        rounded-xl
        text-lg
        p-1">
        create</button>
        <p id="newround_note" class="text-red-400 text-sm italic mt-1 mb-10"></p>
      </div>
    </div>
    <div id="buttons" class="flex flex-col max-w-md mx-auto mt-45">
      <button id="coupable" class="
        flex-1
        bg-red-500
        hover:bg-red-600
        disabled:bg-red-900
        disabled:text-gray-500

        text-3xl
        p-2
        mb-10">
      coupable
      </button>
      
      <button id="non-coupable" class="
        flex-1
        
        bg-blue-500
        hover:bg-blue-600
        disabled:bg-blue-900
        disabled:text-gray-500

        p-2
        text-3xl">
        non coupable
      </button>
      <p id="error" class="text-xl text-center mt-5 text-slate-400 hidden">
        <span class="text-orange-500">error:</span> couldn't judge, see console
      </p>
    </div>

  </body>
</html>
